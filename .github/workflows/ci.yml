name: CI

on:
  push:
    branches: [main, pkg-split]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # uv otherwise prefers its own managed Python and ignores the matrix.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make init

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Test blog samples
        run: make samples-check

      - name: Install website dependencies
        run: cd website && npm ci

      - name: Validate snippets and build the website
        run: cd website && npm run build
