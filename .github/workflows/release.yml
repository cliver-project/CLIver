name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish from (for example v0.3.2)"
        required: true
      package:
        description: "Package to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cliver
          - cliver-core

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make init

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      PACKAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package || 'all' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.9"

      - name: Verify tag matches both package versions
        run: |
          for name in cliver-core cliver; do
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' "packages/${name}/pyproject.toml" | head -n1)"
            if [ "v${version}" != "${REF_NAME}" ]; then
              echo "Tag ${REF_NAME} does not match ${name} version ${version}" >&2
              exit 1
            fi
          done

      - name: Build selected packages
        run: |
          rm -rf dist
          if [ "${PACKAGE}" = "all" ] || [ "${PACKAGE}" = "cliver-core" ]; then
            uv build --package cliver-core --out-dir dist
          fi
          if [ "${PACKAGE}" = "all" ] || [ "${PACKAGE}" = "cliver" ]; then
            uv build --package cliver --out-dir dist
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      PACKAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package || 'all' }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.9"

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "${PACKAGE}" = "all" ] || [ "${PACKAGE}" = "cliver-core" ]; then
            files=(dist/cliver_core-*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No cliver-core artifacts to publish" >&2
              exit 1
            fi
            uv publish "${files[@]}" --trusted-publishing always
          fi
          if [ "${PACKAGE}" = "all" ] || [ "${PACKAGE}" = "cliver" ]; then
            files=(dist/cliver-*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No cliver artifacts to publish" >&2
              exit 1
            fi
            uv publish "${files[@]}" --trusted-publishing always
          fi
