name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make init

      - name: Test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.9"

      - name: Verify tag matches cliver-core version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/cliver-core/pyproject.toml | head -n1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match cliver-core version ${version}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: make dist

      - uses: actions/upload-artifact@v7
        with:
          name: cliver-core-dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.9"

      - uses: actions/download-artifact@v8
        with:
          name: cliver-core-dist
          path: dist

      - name: Publish to PyPI
        run: >-
          uv publish dist/*
          --trusted-publishing always
