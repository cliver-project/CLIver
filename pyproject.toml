[tool.uv.workspace]
members = [
    "packages/cliver-core",
    "packages/cliver",
    "packages/cliver-gateway",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "packages/cliver-core/src/cliver_core/tests",
    "packages/cliver/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**/*" = ["E501"]
