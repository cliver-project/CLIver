[project]
name = "cliver-core"
version = "0.3.0a4"
description = "CLIver — embeddable AgentCore library"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CLIver Project" }]
keywords = ["ai", "agents", "llm", "mcp", "react-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=3.0.0",
    "anthropic>=1.0.0",
    "httpx>=0.28.0",
    "mcp>=2.3.0,<3.0",
]

# The chat stack (both SDKs + httpx for the provider-level media/embed/rerank
# endpoints) and the MCP client SDK are hard dependencies — cliver-core speaks
# the native SDK message structures directly, and MCP support is first-class.
# SDK floors sit at the verified major lines (openai 3.x, anthropic 1.x,
# httpx 0.28.x — its breaking axis pre-1.0) rather than pinning patch
# releases: the transports derive each SDK call's typed parameters at
# import time via signature introspection, so newer releases within the
# line are picked up automatically.  The mcp floor follows the same rule:
# the adapters target the 2.3.0-verified API (Client(transport, mode=...),
# snake_case record attributes, streamable_http_client(http_client=)), and
# <3 guards the next rename wave.
# The `cliver.provider_sdks` entry-point group stays reserved for third
# parties to register brand SDK adapters; cliver-core registers none itself.
[project.optional-dependencies]
# In-process local models.  These pull torch, so they stay opt-in —
# an application chooses the backend it needs.
#   local-st    sentence-transformers embedding models
#   local-flag  FlagEmbedding dense embeddings + cross-encoder rerank
local-st = ["sentence-transformers>=3.0", "huggingface-hub>=0.24.0"]
local-flag = ["FlagEmbedding>=1.3.0", "huggingface-hub>=0.24.0"]
local = ["cliver-core[local-st]", "cliver-core[local-flag]"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.0.270",
    # The HTTP stack the official SDKs ship on; tests mock at that layer
    # (MockTransport) to exercise the SDK parse path.
    "httpx2>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/cliver-project/CLIver"
Repository = "https://github.com/cliver-project/CLIver"

[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Tests stay in the repo and sdist but never ship in the wheel.
wheel-exclude = ["tests"]
