[project]
name = "cliver"
version = "0.3.0a4"
description = "CLIver — Personal AI Lab (CLI dist)"
requires-python = ">=3.10"
dependencies = ["cliver-core==0.3.0a4", "python-dotenv>=1.0"]

[project.scripts]
cliver = "cliver.cli:main"

[tool.uv.sources]
cliver-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"
